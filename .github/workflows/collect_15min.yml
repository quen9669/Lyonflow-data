# =============================================================================
# COLLECTE AUTOMATIQUE VÉLO'V TOUTES LES 15 MINUTES (24h/24)
# =============================================================================
# GitHub lance ce « workflow » tout seul, même quand ton ordinateur est éteint.
#
# PRINCIPE DE LA « BOUCLE LONGUE » (choix validé au Sprint 2) :
# GitHub ne respecte pas l'heure exacte des tâches programmées (la première nuit,
# 20 à 54 minutes entre deux passages). Donc chaque passage reste allumé environ
# 5h30 et collecte lui-même pile à :00, :15, :30 et :45
# (script src/ingestion/collect_loop.py).
#
# PASSAGES « CHAÎNÉS » (choix validé le 20/10/2026) :
#   - à la fin de sa boucle, chaque passage relance lui-même le suivant ;
#   - le réveil horaire de GitHub ne sert plus que de filet de sécurité :
#     il vérifie d'abord si un passage tourne déjà et, si oui, s'arrête
#     tout de suite proprement (en vert) au lieu d'attendre en file.
# Avant ce changement, les réveils en attente étaient « annulés » par GitHub
# et apparaissaient comme des plantages, alors qu'aucun relevé n'était perdu.
# =============================================================================

name: Collecte Vélo'v toutes les 15 min

on:
  schedule:
    # Format « cron » : minute heure jour mois jour-de-semaine (heures en UTC).
    # « 5 * * * * » = à 5 minutes de chaque heure. Ce n'est qu'un « réveil » :
    # l'heure exacte des collectes est gérée par la boucle.
    - cron: "5 * * * *"
  # Permet aussi de lancer un passage à la main depuis l'onglet « Actions » de GitHub
  workflow_dispatch:

# Autorise le workflow à enregistrer (pousser) les nouveaux fichiers dans le dépôt,
# à regarder les passages en cours et à relancer le passage suivant
permissions:
  contents: write
  actions: write

jobs:
  # Le réveil horaire regarde d'abord si un passage tourne déjà
  verifier:
    runs-on: ubuntu-latest
    outputs:
      occupe: ${{ steps.etat.outputs.occupe }}
    steps:
      - name: Un passage tourne-t-il déjà ?
        id: etat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Lancement à la main ou par le passage précédent : on y va."
            echo "occupe=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          autres=$(gh run list --repo "${{ github.repository }}" --workflow collect_15min.yml \
                     --limit 20 --json databaseId,status \
                     --jq "[.[] | select(.databaseId != ${{ github.run_id }}) \
                            | select(.status == \"in_progress\" or .status == \"queued\" \
                                     or .status == \"waiting\" or .status == \"pending\")] | length")
          if [ "$autres" -gt 0 ]; then
            echo "Un passage tourne déjà : rien à faire, tout va bien."
            echo "occupe=true" >> "$GITHUB_OUTPUT"
          else
            echo "Aucun passage en cours : le réveil démarre la collecte."
            echo "occupe=false" >> "$GITHUB_OUTPUT"
          fi

  collecte:
    needs: verifier
    if: ${{ !cancelled() && needs.verifier.outputs.occupe != 'true' }}
    runs-on: ubuntu-latest
    # Filet de sécurité : GitHub coupe à 6h, la boucle s'arrête d'elle-même à 5h30
    timeout-minutes: 350

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer uv (et Python)
        uses: astral-sh/setup-uv@v6

      - name: Installer les librairies du projet
        run: uv sync

      # L'altitude ne change jamais : on ne la télécharge que si le fichier
      # de référence n'existe pas encore. Si l'API d'altitude est en panne,
      # on continue quand même (la colonne altitude restera vide).
      - name: Récupérer l'altitude des stations (une seule fois)
        if: hashFiles('data/reference/stations_altitude.csv') == ''
        continue-on-error: true
        run: uv run python -m src.ingestion.fetch_elevation

      # Le calendrier des vacances scolaires (académie de Lyon) est relu à chaque
      # démarrage : le fichier ne change que si le ministère publie du nouveau.
      # Si le site du ministère est en panne, la collecte continue quand même.
      - name: Mettre à jour le calendrier des vacances scolaires
        continue-on-error: true
        run: uv run python -m src.ingestion.fetch_school_holidays

      # Événements à venir (concerts, matchs…) et qualité de l'air : relevés à chaque
      # démarrage (environ toutes les 5h30). Les fichiers écrits ici sont enregistrés
      # sur GitHub avec le relevé Vélo'v suivant. Une source en panne ne bloque rien.
      - name: Relever les événements et la pollution
        continue-on-error: true
        env:
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
        run: uv run python -m src.ingestion.fetch_events

      - name: Collecter pile toutes les 15 minutes pendant 5h30
        # Compte data.grandlyon.com (P+R, parkings, trafic), stocké dans les « secrets »
        # du dépôt : invisible dans le code et masqué dans les journaux d'exécution.
        env:
          GRANDLYON_LOGIN: ${{ secrets.GRANDLYON_LOGIN }}
          GRANDLYON_PASSWORD: ${{ secrets.GRANDLYON_PASSWORD }}
        run: |
          git config user.name "lyonflow-collecte[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run python -m src.ingestion.collect_loop

      # Le passage relance le suivant, même si sa boucle s'est mal terminée
      - name: Relancer le passage suivant
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect_15min.yml --repo "${{ github.repository }}" --ref main
