# =============================================================================
# PROGRAMME DES GRANDES SALLES ET STADES (une fois par semaine)
# =============================================================================
# Relève le programme de la LDLC Arena, du Groupama Stadium (matchs de l'OL),
# de la Halle Tony Garnier et du Matmut Stadium de Gerland (LOU Rugby), puis
# l'enregistre dans data/bronze/events_salles/ (même format que les événements
# OpenAgenda). Si un site ne répond plus ou change de présentation, le passage
# s'affiche en rouge et GitHub envoie un e-mail.
# =============================================================================

name: Programme des grandes salles (hebdomadaire)

on:
  schedule:
    # Chaque lundi à 3h20 (heure UTC), loin des relevés du quart d'heure
    - cron: "20 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  salles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer uv (et Python)
        uses: astral-sh/setup-uv@v6

      - name: Installer les librairies du projet
        run: uv sync

      # Une source en panne n'empêche pas d'enregistrer les autres
      - name: Relever le programme des salles
        id: releve
        continue-on-error: true
        run: uv run python -m src.ingestion.fetch_venues

      - name: Enregistrer sur GitHub
        run: |
          git config user.name "lyonflow-collecte[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "Programme des grandes salles du $(date -u +%Y-%m-%d)"
          # Le robot du quart d'heure peut avoir enregistré entre-temps : on réessaie
          for essai in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 10
          done
          exit 1

      - name: Signaler une source en panne
        if: steps.releve.outcome == 'failure'
        run: |
          echo "Au moins une source des grandes salles n'a pas répondu : voir l'étape « Relever le programme des salles »."
          exit 1
