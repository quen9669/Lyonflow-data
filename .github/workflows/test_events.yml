# =============================================================================
# TEST D'ACCÈS AUX ÉVÉNEMENTS ET À LA POLLUTION (lancé à la main)
# =============================================================================
# Lance une collecte d'essai (OpenAgenda, Atmo AURA) sans rien enregistrer et
# affiche ce qu'elle trouve (jamais les clés).
# Lancement : onglet « Actions » → « Test d'accès événements et pollution » → « Run workflow ».
# =============================================================================

name: Test d'accès événements et pollution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Tester chaque source
        env:
          OPENAGENDA_API_KEY: ${{ secrets.OPENAGENDA_API_KEY }}
        run: uv run python -m src.ingestion.test_events_access
