# =============================================================================
# TEST D'ACCÈS AUX ALERTES TRAFIC TCL (lancé à la main)
# =============================================================================
# Affiche les alertes TCL en cours (hors bus) telles que le robot les enregistrerait
# dans son journal, sans rien enregistrer.
# Lancement : onglet « Actions » → « Test alertes TCL » → « Run workflow ».
# =============================================================================

name: Test alertes TCL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Lire les alertes TCL sans rien enregistrer
        env:
          GRANDLYON_LOGIN: ${{ secrets.GRANDLYON_LOGIN }}
          GRANDLYON_PASSWORD: ${{ secrets.GRANDLYON_PASSWORD }}
        run: uv run python -m src.ingestion.fetch_tcl
