# =============================================================================
# ESSAI DU PROGRAMME DES GRANDES SALLES (lancé à la main)
# =============================================================================
# Relève le programme des grandes salles sans rien enregistrer et affiche ce
# qu'il trouve, source par source. Utile si un site change de présentation.
# Lancement : onglet « Actions » → « Essai programme des grandes salles » → « Run workflow ».
# =============================================================================

name: Essai programme des grandes salles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Relever sans enregistrer
        run: uv run python -m src.ingestion.fetch_venues --essai
